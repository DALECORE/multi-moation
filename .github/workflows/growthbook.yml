name: GrowthBook bridge

on:
  push:
    paths:
      - "growthbook/**"
      - ".github/workflows/growthbook.yml"
  pull_request:
    paths:
      - "growthbook/**"
      - ".github/workflows/growthbook.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growthbook
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run tests
        run: cargo test
